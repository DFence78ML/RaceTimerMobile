<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Finish Line Mobile - Multi-Person Race Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.json">

  <!-- Fix GitHub Pages missing trailing slash bug before subresources load -->
  <script>
    (function() {
      var p = window.location.pathname;
      if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
      }
    })();
  </script>

  <link rel="stylesheet" href="./style.css">

  <style>
    :root {
      --bg-dark: #0a0e14;
      --surface-glass: rgba(22, 27, 34, 0.78);
      --surface-border: rgba(255, 255, 255, 0.18);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-green: #2ea043;
      --accent-green-hover: #3fb950;
      --accent-red: #da3633;
      --accent-yellow: #d29922;
      --accent-blue: #58a6ff;
      --safe-top: env(safe-area-inset-top, 8px);
      --safe-bottom: env(safe-area-inset-bottom, 8px);
      --safe-left: env(safe-area-inset-left, 8px);
      --safe-right: env(safe-area-inset-right, 8px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Fullscreen Edge-to-Edge Camera Viewport */
    .fullscreen-camera-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      background: #000;
      overflow: hidden;
    }

    video#webcam {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    canvas#overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }

    /* Top Left: Clock & Telemetry HUD */
    .top-left-hud {
      position: fixed;
      top: var(--safe-top);
      left: var(--safe-left);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .clock-card {
      background: var(--surface-glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      display: inline-block;
    }

    .clock-display {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .telemetry-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 0.68rem;
      font-family: monospace;
    }

    .pill {
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid var(--surface-border);
      backdrop-filter: blur(4px);
    }
    .pill.active { border-color: var(--accent-green); color: var(--accent-green); }
    .pill.warning { border-color: var(--accent-yellow); color: var(--accent-yellow); }

    /* Top Right: Layered Finishers Section (Position & Time Only) */
    .finishers-overlay {
      position: fixed;
      top: var(--safe-top);
      right: var(--safe-right);
      width: 154px;
      max-height: 48vh;
      z-index: 10;
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .finishers-overlay-header {
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-tiny {
      background: none;
      border: none;
      color: var(--accent-red);
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 4px;
    }

    .finishers-compact-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    .finisher-compact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      transition: background 0.15s;
    }
    .finisher-compact-row:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .finisher-compact-row:last-child {
      border-bottom: none;
    }

    .finisher-compact-pos {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .finisher-compact-time {
      font-size: 0.84rem;
      font-weight: 600;
      color: #fff;
    }

    /* Small Floating UI Control Buttons at the Bottom */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding-top: 8px;
      padding-bottom: max(8px, var(--safe-bottom));
      padding-left: max(8px, var(--safe-left));
      padding-right: max(8px, var(--safe-right));
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 75%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .dock-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 600px;
      width: 100%;
      pointer-events: auto;
    }

    button.btn-small {
      background: var(--surface-glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-main);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 36px;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    button.btn-small:active { transform: scale(0.96); }
    button.btn-small.btn-primary { background: var(--accent-green); border-color: var(--accent-green-hover); color: #fff; }
    button.btn-small.btn-danger { background: var(--accent-red); border-color: #f85149; color: #fff; }

    /* Modals & Dialogs */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 16px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .modal-content {
      background: #161b22;
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      width: 100%; max-width: 440px; max-height: 90vh;
      overflow-y: auto; padding: 18px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
    .form-input {
      background: #0d1117; border: 1px solid var(--surface-border);
      border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 0.85rem; width: 100%;
    }
    .export-options-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .hidden { display: none !important; }
  </style>

  <!-- TensorFlow.js dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.17.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.17.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.17.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
</head>
<body>

  <!-- Fullscreen Edge-to-Edge Camera -->
  <div class="fullscreen-camera-wrap">
    <video id="webcam" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- Top-Left HUD (Clock & Status) -->
  <div class="top-left-hud">
    <div class="clock-card">
      <div class="clock-display" id="clock-display">00:00.000</div>
    </div>
    <div class="telemetry-pills">
      <span class="pill" id="status-pill">STANDBY</span>
      <span class="pill" id="dir-pill">DIR: L → R</span>
      <span class="pill" id="fps-cam">CAM: --</span>
      <span class="pill" id="fps-inf">INF: --</span>
      <span class="pill" id="active-tracks">0 RUNNERS</span>
    </div>
  </div>

  <!-- Top-Right: Layered Finishers HUD (Position & Time Only) -->
  <div class="finishers-overlay">
    <div class="finishers-overlay-header">
      <span>Finishes (<span id="finisher-count">0</span>)</span>
      <button class="btn-tiny" id="btn-clear-results">Clear</button>
    </div>
    <ul class="finishers-compact-list" id="results-list">
      <!-- Displays only Position & Time -->
    </ul>
  </div>

  <!-- Bottom Floating Dock with Small Buttons -->
  <div class="bottom-dock">
    <div class="dock-container">
      <button class="btn-small btn-primary" id="btn-start">START</button>
      <button class="btn-small btn-danger" id="btn-stop" disabled>STOP</button>
      <button class="btn-small" id="btn-dir">DIR</button>
      <button class="btn-small" id="btn-reset-line">LINE</button>
      <button class="btn-small" id="btn-flip-cam">FLIP</button>
      <button class="btn-small btn-primary" id="btn-export">EXPORT</button>
      <button class="btn-small" id="btn-new-race">NEW</button>
    </div>
  </div>

  <!-- Review / Audit Modal -->
  <div class="modal-overlay hidden" id="review-modal">
    <div class="modal-content">
      <h3 id="modal-title" style="font-size:1.05rem;">Finisher Review</h3>
      <img id="modal-snapshot" style="width:100%; max-height:220px; object-fit:cover; border-radius:6px; background:#000;" alt="Photo evidence">
      <div id="modal-details" style="font-size:0.8rem; line-height:1.45; color:var(--text-muted);"></div>
      <div class="modal-actions">
        <button class="btn-small btn-danger" id="btn-modal-discard">Discard</button>
        <button class="btn-small" id="btn-modal-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Email & CSV Export Modal -->
  <div class="modal-overlay hidden" id="export-modal">
    <div class="modal-content">
      <h3 style="font-size:1.05rem;">Export Results</h3>

      <div class="form-group">
        <label class="form-label" for="export-email">Recipient Email Address:</label>
        <input class="form-input" type="email" id="export-email" placeholder="e.g. results@parkrun.com or timer@gmail.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Export Format:</label>
        <select class="form-input" id="export-format">
          <option value="parkrun_std">Parkrun Standard (Position, Time)</option>
          <option value="parkrun_barcode">Parkrun Scanned (Position, Time, Barcode)</option>
          <option value="audit">Full Timing Audit (Sub-frame Alpha, Flags, ms)</option>
        </select>
      </div>

      <div class="export-options-grid">
        <button class="btn-small btn-primary" id="btn-email-share">Share CSV File to Email App</button>
        <button class="btn-small" id="btn-email-mailto">Open Email App (Embedded Body)</button>
        <button class="btn-small" id="btn-download-csv">Download CSV File Directly</button>
        <button class="btn-small" id="btn-copy-csv">Copy CSV to Clipboard</button>
      </div>

      <div class="modal-actions">
        <button class="btn-small" id="btn-export-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- System Alert Modal -->
  <div class="modal-overlay hidden" id="alert-modal">
    <div class="modal-content">
      <h3 id="alert-title" style="color:var(--accent-red); font-size:1.05rem;">System Alert</h3>
      <p id="alert-message" style="font-size:0.85rem; line-height:1.4;"></p>
      <div class="modal-actions">
        <button class="btn-small btn-primary" id="btn-alert-dismiss">Dismiss</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
