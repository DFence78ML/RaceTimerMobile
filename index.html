<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Finish Line Mobile - Multi-Runner Race Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230a0e14'/%3E%3Cpath d='M120 256h272M256 120v272' stroke='%232ea043' stroke-width='36' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='256' r='60' fill='%233fb950'/%3E%3Cpath d='M180 180l152 152' stroke='%23ffffff' stroke-width='20' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Subdirectory path normalization for GitHub Pages -->
  <script>
    (function() {
      var p = window.location.pathname;
      if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
      }
    })();
  </script>

  <link rel="stylesheet" href="./style.css">

  <!-- Core Layout CSS for zero-latency mobile rendering -->
  <style>
    :root {
      --bg-dark: #000000;
      --surface-glass: rgba(18, 22, 28, 0.88);
      --surface-border: rgba(255, 255, 255, 0.16);
      --accent-green: #2ea043;
      --accent-red: #da3633;
      --accent-yellow: #d29922;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --safe-top: env(safe-area-inset-top, 8px);
      --safe-bottom: env(safe-area-inset-bottom, 8px);
      --safe-left: env(safe-area-inset-left, 8px);
      --safe-right: env(safe-area-inset-right, 8px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .fullscreen-camera { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 1; background: #000; overflow: hidden; }
    video#webcam { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; touch-action: none; }
  </style>

  <!-- TensorFlow.js and MoveNet MultiPose dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.17.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.17.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.17.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
</head>
<body>

  <!-- Fullscreen Camera Viewport -->
  <div class="fullscreen-camera">
    <video id="webcam" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- Top-Left HUD (Clock & Real-Time Performance Telemetry) -->
  <div class="top-left-hud">
    <div class="clock-card" aria-label="Race Clock">
      <div class="clock-display" id="clock-display">00:00.000</div>
    </div>
    <div class="telemetry-pills">
      <span class="pill" id="status-pill">INIT</span>
      <span class="pill" id="dir-pill">DIR: L → R</span>
      <span class="pill" id="fps-render">RND: --</span>
      <span class="pill" id="fps-cam">CAM: --</span>
      <span class="pill" id="fps-inf">INF: --</span>
      <span class="pill" id="active-tracks">0 RUNNERS</span>
    </div>
  </div>

  <!-- Top-Right HUD: Collapsible Minimal Finishers (Position & Time Only) -->
  <div class="finishers-overlay collapsed" id="finishers-panel" aria-label="Finishers List">
    <div class="finishers-overlay-header">
      <span>Finishes (<span id="finisher-count">0</span>)</span>
      <div class="header-actions">
        <button class="btn-toggle-panel" id="btn-toggle-finishers" title="Toggle Panel" aria-label="Toggle Panel">▲</button>
        <button class="btn-tiny" id="btn-clear-results" title="Clear current session">Clear</button>
      </div>
    </div>
    <ul class="finishers-compact-list" id="results-list" role="list">
      <!-- Minimal Position and Formatted Time -->
    </ul>
  </div>

  <!-- Bottom Floating Control Dock -->
  <div class="bottom-dock">
    <div class="dock-container" role="toolbar" aria-label="Race Timing Controls">
      <button class="btn-small btn-primary" id="btn-start" disabled>START</button>
      <button class="btn-small btn-danger" id="btn-stop" disabled>STOP</button>
      <button class="btn-small" id="btn-toggle-controls" aria-expanded="false" aria-controls="extra-controls">MORE</button>
      <div class="extra-controls" id="extra-controls">
        <button class="btn-small" id="btn-dir">DIR</button>
        <button class="btn-small" id="btn-reset-line">LINE</button>
        <button class="btn-small" id="btn-flip-cam">FLIP</button>
        <button class="btn-small btn-primary" id="btn-export">EXPORT</button>
        <button class="btn-small" id="btn-new-race">NEW</button>
      </div>
    </div>
  </div>

  <!-- Finisher Audit Review Modal -->
  <div class="modal-overlay hidden" id="review-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <h3 id="modal-title" style="font-size:1.05rem;">Finisher Audit</h3>
      <div id="modal-details" style="font-size:0.82rem; line-height:1.55; color:var(--text-main);"></div>
      <div class="modal-actions">
        <button class="btn-small btn-danger" id="btn-modal-discard">Discard Finisher</button>
        <button class="btn-small" id="btn-modal-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Email & CSV Export Modal -->
  <div class="modal-overlay hidden" id="export-modal" role="dialog" aria-modal="true" aria-labelledby="export-modal-title">
    <div class="modal-content">
      <h3 id="export-modal-title" style="font-size:1.05rem;">Export Results</h3>

      <div class="form-group">
        <label class="form-label" for="export-email">Recipient Email Address:</label>
        <input class="form-input" type="email" id="export-email" placeholder="e.g. results@parkrun.com or timer@gmail.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="export-format">Export Format:</label>
        <select class="form-input" id="export-format">
          <option value="parkrun_std">Parkrun Standard (Position, Time)</option>
          <option value="parkrun_barcode">Parkrun Scanned (Position, Time, Barcode)</option>
          <option value="audit">Full Timing Audit (Sub-frame Alpha, Session, ms)</option>
        </select>
      </div>

      <div class="export-options-grid">
        <button class="btn-small btn-primary" id="btn-email-share">Share CSV File to Email App</button>
        <button class="btn-small" id="btn-email-mailto">Open Email App (Embedded Body)</button>
        <button class="btn-small" id="btn-download-csv">Download CSV File Directly</button>
        <button class="btn-small" id="btn-copy-csv">Copy CSV to Clipboard</button>
      </div>

      <div class="modal-actions">
        <button class="btn-small" id="btn-export-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- System Alert Modal -->
  <div class="modal-overlay hidden" id="alert-modal" role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
    <div class="modal-content">
      <h3 id="alert-title" style="color:var(--accent-red); font-size:1.05rem;">System Notice</h3>
      <p id="alert-message" style="font-size:0.86rem; line-height:1.45;"></p>
      <div class="modal-actions">
        <button class="btn-small btn-primary" id="btn-alert-dismiss">Dismiss</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
