<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Runner Detection & Tracking Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --accent: #2ea043;
      --accent-red: #da3633;
      --accent-yellow: #d29922;
      --accent-blue: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .viewport-pane {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    canvas#stage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .sidebar {
      width: 340px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-section {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section h3 {
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: var(--accent-blue);
      text-transform: uppercase;
    }
    .control-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    button, select {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: #3fb950; }
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.72rem;
    }
    .telemetry-item {
      background: #0d1117;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .finisher-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 8px;
    }
    .finisher-card {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }
    .finisher-pos { font-weight: 800; color: var(--accent); font-size: 1rem; width: 30px; }
    .finisher-tags { display: flex; gap: 4px; }
    .tag { font-size: 0.65rem; padding: 2px 4px; border-radius: 4px; background: #21262d; }
    .tag.warn { background: rgba(210, 153, 34, 0.25); color: var(--accent-yellow); }
    video#video-source { display: none; }
  </style>
</head>
<body>

  <header>
    <div><strong>Runner Tracking Prototype</strong> (ByteTrack + Parametric Sub-Frame)</div>
    <div id="status-tag" style="font-size: 0.8rem; color: var(--accent);">STANDBY</div>
  </header>

  <div class="layout">
    <div class="viewport-pane">
      <video id="video-source" playsinline muted></video>
      <canvas id="stage" width="640" height="480"></canvas>
    </div>

    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Input Source</h3>
        <div class="control-row">
          <button id="btn-camera" class="primary">Live Camera</button>
          <input type="file" id="file-input" accept="video/*" style="display:none">
          <button id="btn-file">Load Video</button>
          <button id="btn-mock">Run Scenario</button>
        </div>
        <div class="control-row" id="scenario-selector-row" style="display:none;">
          <select id="mock-scenario" style="width:100%;">
            <option value="pack_crossing">Synthetic: Dense Pack Finish</option>
            <option value="occlusion_and_cross">Synthetic: Overlap / Occlusion</option>
            <option value="reversal_no_finish">Synthetic: Reversal at Line</option>
          </select>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Timing Controls</h3>
        <div class="control-row">
          <button id="btn-start" class="primary">Start Race</button>
          <button id="btn-stop">Stop Race</button>
          <button id="btn-reset">Reset</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Diagnostics & Telemetry</h3>
        <div class="telemetry-grid">
          <div class="telemetry-item">Pipeline FPS: <span id="val-fps">0</span></div>
          <div class="telemetry-item">Inference/Frame: <span id="val-lat">0 ms</span></div>
          <div class="telemetry-item">Tracks: <span id="val-tracks">0</span></div>
          <div class="telemetry-item">Finishers: <span id="val-fin">0</span></div>
        </div>
      </div>

      <div class="sidebar-section" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <h3>Finish Events Log</h3>
        <ul class="finisher-list" id="finisher-log"></ul>
      </div>
    </div>
  </div>

  <script type="module">
    import { RunnerPipeline } from './src/pipeline/RunnerPipeline.js';
    import { MockDetector } from './src/pipeline/MockDetector.js';

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video-source');
    const finisherLog = document.getElementById('finisher-log');

    let activePipeline = new RunnerPipeline({
      lineP1: { x: 0.5, y: 0.05 },
      lineP2: { x: 0.5, y: 0.95 },
      direction: 'ltr',
      onFinisherDetected: renderFinisher
    });

    let inputMode = 'mock'; // 'camera', 'file', 'mock'
    let mockDetector = new MockDetector('pack_crossing');
    let lastTime = performance.now();
    let frameCounter = 0;
    let fps = 0;

    function renderFinisher(f) {
      document.getElementById('val-fin').textContent = activePipeline.finishers.length;
      const li = document.createElement('li');
      li.className = 'finisher-card';
      li.innerHTML = `
        <div class="finisher-pos">#${f.position}</div>
        <div>
          <div><strong>${f.formattedTime}</strong> (ID: ${f.trackId})</div>
          <div class="finisher-tags">
            <span class="tag">α: ${f.alpha}</span>
            <span class="tag">conf: ${f.confidence}</span>
            ${f.flags.map(fl => `<span class="tag warn">${fl}</span>`).join('')}
          </div>
        </div>
      `;
      finisherLog.prepend(li);
    }

    function drawStage(tracks) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (inputMode === 'camera' || inputMode === 'file') {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      } else {
        // Clear background for mock test
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Draw Finish Line
      const p1 = activePipeline.crossingEngine.p1;
      const p2 = activePipeline.crossingEngine.p2;
      ctx.beginPath();
      ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
      ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
      ctx.strokeStyle = '#2ea043';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Active Tracks
      for (const t of tracks) {
        const box = t.kf.getBBox();
        const bx = box.x * canvas.width;
        const by = box.y * canvas.height;
        const bw = box.width * canvas.width;
        const bh = box.height * canvas.height;

        ctx.strokeStyle = t.hasCrossed ? '#da3633' : '#58a6ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bw, bh);

        // Draw Torso Center Landmark
        if (t.trajectory.length > 0) {
          const pt = t.trajectory[t.trajectory.length - 1];
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 4, 0, 2 * Math.PI);
          ctx.fillStyle = t.hasCrossed ? '#da3633' : '#2ea043';
          ctx.fill();
        }

        ctx.fillStyle = '#fff';
        ctx.font = '11px monospace';
        ctx.fillText(`ID:${t.id} (${t.score.toFixed(2)})`, bx, Math.max(12, by - 4));
      }
    }

    function loop(now) {
      frameCounter++;
      if (now - lastTime >= 1000) {
        fps = frameCounter;
        frameCounter = 0;
        lastTime = now;
        document.getElementById('val-fps').textContent = fps;
      }

      const t0 = performance.now();
      let detections = [];

      if (inputMode === 'mock') {
        detections = mockDetector.generateFrame(now);
      } else if ((inputMode === 'camera' || inputMode === 'file') && video.readyState >= 2) {
        // Fallback placeholder for direct webcam input without loaded ONNX weights
        detections = [];
      }

      const { activeTracks } = activePipeline.processFrame(detections, now);
      const latency = performance.now() - t0;

      document.getElementById('val-lat').textContent = latency.toFixed(1) + ' ms';
      document.getElementById('val-tracks').textContent = activeTracks.length;

      drawStage(activeTracks);
      requestAnimationFrame(loop);
    }

    // UI Event Wiring
    document.getElementById('btn-start').onclick = () => {
      activePipeline.startRace(performance.now());
      document.getElementById('status-tag').textContent = 'TIMING ACTIVE';
      document.getElementById('status-tag').style.color = '#2ea043';
    };

    document.getElementById('btn-stop').onclick = () => {
      activePipeline.stopRace();
      document.getElementById('status-tag').textContent = 'STOPPED';
      document.getElementById('status-tag').style.color = '#da3633';
    };

    document.getElementById('btn-reset').onclick = () => {
      activePipeline = new RunnerPipeline({
        lineP1: { x: 0.5, y: 0.05 },
        lineP2: { x: 0.5, y: 0.95 },
        direction: 'ltr',
        onFinisherDetected: renderFinisher
      });
      finisherLog.innerHTML = '';
      document.getElementById('val-fin').textContent = '0';
      if (inputMode === 'mock') {
        mockDetector = new MockDetector(document.getElementById('mock-scenario').value);
      }
    };

    document.getElementById('btn-mock').onclick = () => {
      inputMode = 'mock';
      document.getElementById('scenario-selector-row').style.display = 'flex';
      mockDetector = new MockDetector(document.getElementById('mock-scenario').value);
    };

    document.getElementById('mock-scenario').onchange = (e) => {
      mockDetector = new MockDetector(e.target.value);
    };

    document.getElementById('btn-file').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        inputMode = 'file';
        document.getElementById('scenario-selector-row').style.display = 'none';
        video.src = URL.createObjectURL(file);
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          video.play();
        };
      }
    };

    document.getElementById('btn-camera').onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        inputMode = 'camera';
        document.getElementById('scenario-selector-row').style.display = 'none';
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          video.play();
        };
      } catch (err) {
        alert('Could not start camera: ' + err.message);
      }
    };

    requestAnimationFrame(loop);
  </script>
</body>
</html>
