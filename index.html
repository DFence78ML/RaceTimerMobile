<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>Race Timer</title>
  <style>
    :root{color-scheme:dark;background:#080b10}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080b10}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .layout{position:fixed;inset:0;display:flex;overflow:hidden}
    .viewport-pane{position:relative;flex:1;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;background:#000}
    #video-source{display:none}
    #stage{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
    button{font:inherit;cursor:pointer}
    button:focus-visible{outline:2px solid #58a6ff;outline-offset:2px}
    #app-more-menu[hidden]{display:none!important}
    @media(max-width:420px){
      #app-controls{gap:5px!important;padding:6px!important}
      #app-controls>button{min-width:58px!important;padding:0 11px!important;font-size:12px!important}
    }
  </style>
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <main class="layout">
    <section class="viewport-pane" aria-label="Race camera and timing view">
      <video id="video-source" playsinline muted autoplay></video>
      <canvas id="stage" width="1280" height="720" aria-label="Live camera with runner tracking overlay"></canvas>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
